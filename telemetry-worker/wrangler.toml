# GenClass telemetry collector (Cloudflare Worker + R2).
# Deploy: npx --yes wrangler@4 deploy   (from this directory)
name = "genclass-telemetry"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "144bd5f5270b51dbe7faf46227a154f0"
workers_dev = true
# Never log request contents: no observability/logpush of request bodies or headers.
logpush = false

# genclass.dev paths that the site (worker `genclass-site`, custom domain) does not serve. Routes run in front of
# the custom domain; unknown paths under /start* and /dashboard* are passed to the site (service binding SITE).
routes = [
  { pattern = "genclass.dev/dashboard*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/start*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/api/*", zone_name = "genclass.dev" },
  # Accounts (src/auth.ts). Unknown paths under these prefixes are handed to the site like the ones above.
  { pattern = "genclass.dev/login*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/signup*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/logout*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/account*", zone_name = "genclass.dev" },
  { pattern = "genclass.dev/auth/*", zone_name = "genclass.dev" },
  # The GitHub App (src/github/*): its public page, the page GitHub sends people to after installing, and "Connect
  # GitHub". Its webhook (/api/github/webhook) and the account page (/account/github) are under the routes above.
  { pattern = "genclass.dev/github*", zone_name = "genclass.dev" },
]

# Account settings. Production uses the defaults in src/auth.ts (AUTH_ORIGIN https://genclass.dev, AUTH_RP_ID
# genclass.dev); local development overrides them in .dev.vars (see .dev.vars.example and the README).
# Secrets, set with `npx wrangler secret put` and never committed: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET. Without a pair, that provider's button is not shown; an email and a password
# are always offered, so the site always has a way in.

# The newest @genclass/runtime on npm, on any dist-tag. Below 0.3.0-beta.0 the Connect panel, /start and private
# dashboards say first that project keys and `login` are not published yet. Set it (with pages.ts SNIPPET_RUNTIME, then
# deploy) to every release once release.yml has published it and jsDelivr serves it: 0.3.0-beta.6 now, "0.3.0" at 0.3.0
# (with RUNTIME_PKG).
[vars]
RUNTIME_ON_NPM = "0.3.0-beta.6"
# "on" sells the plans marked managed_payments in billing/plans.json through Stripe Managed Payments (Stripe, through
# Link, is the merchant of record, for 3.5% of each payment on top of Stripe's fees). No plan is marked today
# (Team is sold on standard Checkout), so it stays "off"; README "Paid plans".
MANAGED_PAYMENTS = "off"
# The GitHub App, genclass-dev[bot] (docs/github-app/SETUP.md). GITHUB_APP_SLUG is the app's URL name on GitHub
# (github.com/apps/<slug>; its bot is <slug>[bot]). GITHUB_APP_PRIVATE_REPOS: "plan" reviews private repositories only
# for an installation whose GenClass account or GitHub Marketplace plan includes them (billing/plans.json
# github_private); "open" reviews every repository. Public repositories are always reviewed, free.
# "open" from 2026-11-10 (the owner: free for every repository while it was new); "plan" since billing/plans.json
# version 3 (2026-11-11, the owner): private repositories come with Team and Enterprise. A private repository without
# such a plan gets one neutral check that says so, and is not read.
GITHUB_APP_SLUG = "genclass-dev"
GITHUB_APP_PRIVATE_REPOS = "plan"
# GITHUB_APP_WORKFLOW_LINK: "on" puts a link on the check that has no race files to read, and a small form on
# /github/setup, that opens GitHub's own new-file editor with docs/github-app/workflows/genclass.yml filled in, so
# adding that file is a review and a commit (src/github/workflow-file.ts; docs/github-app/SETUP.md). Anything else is
# off, and then nothing the app writes on GitHub is different. "on" since 2026-11-10: @genclass/playwright 0.1.0, which
# that workflow installs, is on npm.
GITHUB_APP_WORKFLOW_LINK = "on"
# GITHUB_APP_OWN_ACCOUNTS: our own GitHub accounts, separated by commas (the organization and the maintainers). An
# install or uninstall on one of them is counted in a row of its own in the daily counts (github_install_days,
# migration 0016), so our test installs are never read as someone else's. It changes nothing else.
GITHUB_APP_OWN_ACCOUNTS = "genclass-dev,Karanvir1729,MeharPro"

# Paid plans (README "Paid plans"), Worker secrets: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# STRIPE_WEBHOOK_SECRET_TEST, STRIPE_PORTAL_CONFIGURATION and STRIPE_PORTAL_CONFIGURATION_TEST (GenClass's Billing
# Portal configuration id; scripts/stripe-setup.mjs stores the ones for its key's mode), STRIPE_TEST_ACCOUNTS (who
# can buy while the key is a test key), INTEGRATIONS_KEY (32 random bytes, base64) and, optionally, NOTIFY_WEBHOOK.
# Without a live STRIPE_SECRET_KEY nothing is on sale to the public; the Free plan (the dashboard included) applies
# anyway. GenClass has no trial.
# The key is for GenClass's own Stripe account ("GenClass"); the worker and the setup script still touch only
# GenClass's own objects there, as when the account was shared with another business (README "Stripe object ownership").

# The GitHub App (README "The GitHub App"; docs/github-app/SETUP.md), Worker secrets: GITHUB_APP_ID (the app's numeric
# id), GITHUB_APP_PRIVATE_KEY (the PEM GitHub generated, as it is), GITHUB_APP_WEBHOOK_SECRET (what the app's webhook
# is signed with) and, for "Connect GitHub" on the account page, GITHUB_APP_CLIENT_ID and GITHUB_APP_CLIENT_SECRET;
# optionally GITHUB_MARKETPLACE_WEBHOOK_SECRET (the Marketplace listing's own webhook; default: the app's secret).
# Without the first three the app is off: /api/github/webhook answers 503, its pages are not found, and nothing else
# on this worker changes. They are not the GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET above, which belong to the OAuth
# app behind "Sign in with GitHub".

# `genclass suggest` (README "The genclass command"; src/suggest.ts), a Worker secret: OPENAI_API_KEY, the key of the
# model that orders and explains the checks that failed on someone's app. Without it no model is asked and the plan is
# ordered by the checks' own weights. SUGGEST_MODEL (a var) names the model; unset, src/suggest.ts DEFAULT_MODEL.
# Migration 0015 (suggest_usage) holds each account's runs per day; without it there is no model run either.

[observability]
enabled = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "genclass-telemetry"

# Per-app tokens and dashboards (see README). D1 holds projects and aggregates; created 2026-10-10.
[[d1_databases]]
binding = "DB"
database_name = "genclass-dashboard"
database_id = "694d7d16-8a47-4810-8e0d-e9c89533460a"
migrations_dir = "migrations"

# Project creation: 10 per 60 s per client (keyed by a hash of the client IP, never stored).
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "7301"
simple = { limit = 10, period = 60 }

# Batches per client IP: 1200 per 60 s, a ceiling for many pages behind one shared address (the runtime sends at most
# one every 10 s per page; the IP is never stored). The tight budget is per session, below.
[[ratelimits]]
name = "LIMIT"
namespace_id = "4802"
simple = { limit = 1200, period = 60 }

# Batches per session id (the body's sid): 30 per 60 s; one page sends about 6 a minute.
[[ratelimits]]
name = "SESSION_LIMIT"
namespace_id = "4803"
simple = { limit = 30, period = 60 }

# Sign-up, sign-in (passwords too) and the CLI's device flow: 20 per 60 s per client IP and route (the key is a hash of
# the route and the IP; the IP is never stored). Wrong passwords also slow down per account (src/password.ts).
[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "7302"
simple = { limit = 20, period = 60 }

# Export pages (src/billing.ts): 120 per 60 s per account (the key is a hash of the account id).
[[ratelimits]]
name = "EXPORT_LIMIT"
namespace_id = "7303"
simple = { limit = 120, period = 60 }

# Read-only use of the site worker: unknown genclass.dev/start* and /dashboard* paths are handed to it unchanged.
[[services]]
binding = "SITE"
service = "genclass-site"

# Two triggers, told apart in `scheduled` (src/index.ts) by their expression.
# "17 3 * * *": the daily retention sweep of dashboard rows (03:17 UTC), followed by the GitHub App's owed reviews.
# "*/20 * * * *": every 20 minutes, the GitHub App's owed reviews only (src/github/handlers.ts SWEEP_CRON and
# githubSweep: at most 20 pull requests a run). Without it an owed review waits for the daily run.
# "7 * * * *": GenClass reports by email that are due, and P0 alerts (src/report-sweep.ts REPORT_CRON).
[triggers]
crons = ["17 3 * * *", "*/20 * * * *", "7 * * * *"]

# GenClass reports and alerts by email (src/report.ts), through Cloudflare Email Sending. genclass.dev is onboarded
# for sending (wrangler email sending list); the binding may send only from report@genclass.dev. Without it (a
# self-hosted collector, wrangler.selfhost.toml) nothing is emailed. `wrangler dev` simulates it and sends nothing.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["report@genclass.dev"]

