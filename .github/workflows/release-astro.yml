name: Release Astro integration

# Publishes @genclass/astro to npm from a tag `astro-v<version>` whose version equals packages/astro/package.json (e.g.
# astro-v0.1.0), with npm provenance, the same way release-playwright.yml publishes @genclass/playwright.
# Authentication: npm trusted publishing (OIDC, `id-token: write`); no npm token is stored in the repository.
#
# Owner setup:
# - First version only: npm configures trusted publishing from a package's own settings page, so the package must exist
#   before this workflow can publish it. Push the tag once: the run builds, tests (the generated script, the hook, then
#   one `astro build` of the fixture site), packs, installs the tarball next to the runtime npm serves and uploads it
#   as the `astro-tarball` artifact, and its publish step fails without a trusted publisher. Publish that exact tarball
#   once from your own npm login (`npm publish genclass-astro-<version>.tgz --access public`), then on npmjs.com:
#   @genclass/astro → Settings → Trusted publishing → GitHub Actions: organization genclass-dev, repository GenClass,
#   workflow filename release-astro.yml, environment npm-publish. Later versions publish from here.
# - The npm-publish GitHub environment (shared with the other release workflows) asks its reviewers to approve each
#   run, and has to allow the tag rule `astro-v*`.
#
# The integration only injects the import of the runtime (`@genclass/runtime/auto`), a peer dependency: the run checks
# that the runtime this repository builds, which the fixture site is built with, is on npm, and that it and the one
# `npm install @genclass/runtime@beta` gets are inside the integration's peer range.
# Being on npm is the listing: astro.build/integrations reads npm weekly for the keywords `astro-integration` and
# `withastro`, which the run holds in package.json (docs/adoption/listings/astro-integration.md). Nothing is submitted
# from here.

on:
  push:
    tags: ["astro-v*"]

permissions:
  contents: read

concurrency:
  group: release-astro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: "@genclass/astro: verify, build, test, publish with provenance"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and the provenance attestation
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Astro 7 declares Node 22.23 / 24.15 or later (integrations.yml runs the same line)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # trusted publishing needs npm >= 11.5.1
      - name: npm 11
        run: npm install -g npm@11 && npm --version

      - name: The tag names the package version, and npm serves a runtime inside the peer range
        run: |
          TAG="${GITHUB_REF_NAME#astro-v}"
          PKG=$(node -p "require('./packages/astro/package.json').version")
          echo "tag $TAG, package.json $PKG"
          test "$TAG" = "$PKG"
          grep -qF "## $PKG" packages/astro/CHANGELOG.md
          # (`! grep` would not stop a `bash -e` step, so the refusals here are spelled out)
          if grep -qF "## $PKG (unreleased)" packages/astro/CHANGELOG.md; then echo "::error::the CHANGELOG still calls $PKG unreleased"; exit 1; fi
          # the keywords the integrations library and `astro add` find the package by
          node -e 'const k = require("./packages/astro/package.json").keywords; for (const w of ["astro-integration", "withastro"]) if (!k.includes(w)) { console.error("keyword missing: " + w); process.exit(1); }'
          # the runtime this repository builds is the one the fixture site below is built with: npm must serve that
          # version, and the peer range must take it and the version `npm install @genclass/runtime@beta` gets
          RT=$(node -p "require('./packages/runtime/package.json').version")
          PEER=$(node -p "require('./packages/astro/package.json').peerDependencies['@genclass/runtime']")
          IN_RANGE=$(npm view "@genclass/runtime@$PEER" version --json)
          BETA=$(npm view @genclass/runtime dist-tags.beta)
          echo "runtime here $RT, npm's beta $BETA, peer range $PEER"
          grep -qF "\"$RT\"" <<< "$IN_RANGE" || { echo "::error::@genclass/runtime $RT is not on npm inside the peer range"; exit 1; }
          grep -qF "\"$BETA\"" <<< "$IN_RANGE" || { echo "::error::npm's beta, @genclass/runtime $BETA, is outside the peer range"; exit 1; }

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the runtime (the fixture imports it)
        run: npm run build -w @genclass/runtime

      - name: Typecheck, build
        run: |
          npm run typecheck -w @genclass/astro
          npm run build -w @genclass/astro

      - name: Tests (generated script, the hook, one astro build of the fixture)
        working-directory: packages/astro
        run: npx vitest run

      - name: Pack
        id: pack
        working-directory: packages/astro
        run: |
          FILE=$(npm pack --silent | tail -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          sha512sum "$FILE"
          tar -tzf "$FILE" | sort > "$FILE.files.txt"
          cat "$FILE.files.txt"
          # the tarball holds the built integration and its types; no tests or sources
          grep -qx "package/dist/index.js" "$FILE.files.txt"
          grep -qx "package/dist/index.d.ts" "$FILE.files.txt"
          grep -qx "package/README.md" "$FILE.files.txt"
          grep -qx "package/CHANGELOG.md" "$FILE.files.txt"
          grep -qx "package/LICENSE" "$FILE.files.txt"
          if grep -qE "^package/(test|src)/" "$FILE.files.txt"; then echo "::error::tests or sources are in the tarball"; exit 1; fi

      # The README's install line, with the tarball in place of the name (npm adds the `astro` peer). npm only warns
      # about a peer range that is not met, so `npm ls` (which fails on one) is the check.
      - name: The tarball installs next to the runtime npm serves, and loads
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts "$GITHUB_WORKSPACE/packages/astro/${{ steps.pack.outputs.file }}" @genclass/runtime@beta
          npm ls @genclass/astro @genclass/runtime astro
          node --input-type=module -e 'const g = (await import("@genclass/astro")).default; const i = g(); console.log("integration:", typeof g, i.name, Object.keys(i.hooks).join(","))' | grep -qx "integration: function @genclass/astro astro:config:setup"

      - uses: actions/upload-artifact@v4
        with:
          name: astro-tarball
          path: |
            packages/astro/${{ steps.pack.outputs.file }}
            packages/astro/${{ steps.pack.outputs.file }}.files.txt
          if-no-files-found: error

      - name: Publish with provenance
        working-directory: packages/astro
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) DIST_TAG=$(echo "${VERSION#*-}" | cut -d. -f1) ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish "${{ steps.pack.outputs.file }}" --provenance --access public --tag "$DIST_TAG"

      - name: Verify the registry signature and provenance
        run: |
          VERSION=$(node -p "require('./packages/astro/package.json').version")
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          npm init -y > /dev/null
          for i in $(seq 1 40); do npm view "@genclass/astro@$VERSION" version --prefer-online && break; sleep 20; done
          for i in $(seq 1 10); do npm install --no-audit --no-fund --ignore-scripts "@genclass/astro@$VERSION" @genclass/runtime@beta && break; sleep 30; done
          for i in $(seq 1 20); do npm audit signatures && break; echo "attestations not served yet, retry $i"; sleep 30; done
          # the published integration is importable by name next to the runtime, with the default export `astro add` needs
          npm ls @genclass/astro @genclass/runtime astro
          node --input-type=module -e 'const g = (await import("@genclass/astro")).default; const i = g(); console.log("integration:", typeof g, i.name, Object.keys(i.hooks).join(","))' | grep -qx "integration: function @genclass/astro astro:config:setup"
