name: Playwright reporter

# @genclass/playwright (packages/playwright): typecheck, build and the unit tests of the fixture (on a fake page),
# the register entry (on fakes of Playwright's objects, and in real Playwright runs without a browser), the reporter,
# the summariser and the commands, then one real Playwright run (no browser) that loads the reporter by its module
# name, and in a second job the end-to-end check in Chromium (packages/playwright/test/e2e), in two halves. The
# fixture: the MCP e2e search page with the fixture's seeded chaos, five seeds per test, the buggy page must get the
# overwrote-newer witness, the fixed page and the latency-only run must get nothing, and the reporter must render
# it. Then the same page under a suite that imports only @playwright/test (packages/playwright/test/e2e-unmodified),
# run through genclass-playwright-run: the same three requirements, under the command's two seeds. Last, a test that
# fails in some runs (packages/playwright/test/e2e-flaky), through `genclass-playwright-run --explain-flaky=16`:
# sixteen Playwright runs, one per seed, and the comparison of its failing and passing runs must name the order of
# responses the buggy page gets wrong. A separate
# workflow from ci.yml so it never blocks the main CI job. It renders the unit-test fixture's report into the job
# summary to show what a pull-request comment would look like; it posts nothing and sends nothing anywhere (the app
# server listens on 127.0.0.1 inside the runner; the page's model is skipped).

on:
  push:
    paths:
      - "packages/playwright/**"
      - "packages/runtime/src/**"
      - "packages/runtime/package.json"
      - "packages/runtime/tsup.config.ts"
      - "packages/mcp/test/e2e/app/**"
      - "package-lock.json"
      - ".github/workflows/playwright-reporter.yml"
  pull_request:
    paths:
      - "packages/playwright/**"
      - "packages/runtime/src/**"
      - "packages/runtime/package.json"
      - "packages/runtime/tsup.config.ts"
      - "packages/mcp/test/e2e/app/**"
      - "package-lock.json"
      - ".github/workflows/playwright-reporter.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-reporter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: "@genclass/playwright: typecheck, build, unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck -w @genclass/playwright

      - name: Build
        run: npm run build -w @genclass/playwright

      - name: Unit tests
        working-directory: packages/playwright
        run: npx vitest run

      - name: The fixture's report, rendered by the built command
        working-directory: packages/playwright
        run: |
          node bin/genclass-playwright-report.mjs test/fixtures/races --out - > "$RUNNER_TEMP/genclass-report.md"
          cat "$RUNNER_TEMP/genclass-report.md" >> "$GITHUB_STEP_SUMMARY"

      # A real Playwright run (the @playwright/test devDependency; no browser: the test uses no page). Playwright
      # loads "@genclass/playwright/reporter" by name the way a user's config does (require.resolve from the config's
      # directory), the test writes the fixture's race files, and the reporter must write the same report the command
      # renders from those files. Playwright's own dot reporter must still print, since this reporter does not claim
      # stdout.
      - name: Playwright loads the reporter by its module name (real run, no browser)
        working-directory: packages/playwright/test/playwright-smoke
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/node_modules/@playwright/test/cli.js" test 2>&1 | tee "$RUNNER_TEMP/playwright.log"
          grep -qF "1 passed" "$RUNNER_TEMP/playwright.log"
          grep -qF "GenClass report written to" "$RUNNER_TEMP/playwright.log"
          node ../../bin/genclass-playwright-report.mjs --out - > "$RUNNER_TEMP/expected.md"
          diff "$RUNNER_TEMP/expected.md" genclass-report.md
          grep -qF '**1 reproducible**' genclass-report.md

  e2e:
    name: "@genclass/playwright: the fixture and an unmodified suite end to end in Chromium"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build (the runtime's dist/ is what the fixture serves to the page)
        run: |
          npm run build -w @genclass/runtime
          npm run build -w @genclass/playwright

      - name: Chromium
        run: npx playwright install --with-deps chromium

      # the unit test that resolves the installed runtime's dist/ by default needs the runtime built, as here
      - name: Unit tests with the runtime built
        working-directory: packages/playwright
        run: npx vitest run test/install.test.ts

      # Three Playwright runs, each a child process with a time limit: the fixture's suite (15 tests), then the
      # unmodified suite twice through genclass-playwright-run (latency only: 2 tests; the defaults: 4 tests). Then
      # one more child process with a time limit: --explain-flaky=16 on a suite of one test, sixteen short Playwright
      # runs (each starts the app server again).
      - name: End to end (the fixture, then an unmodified suite through the command; buggy page flagged, fixed page and latency-only runs clean)
        # shell: bash runs with pipefail, so a failing run.mjs fails the step even though tee succeeds
        shell: bash
        run: node packages/playwright/test/e2e/run.mjs | tee "$RUNNER_TEMP/e2e.log"

      # The race files of this run, for genclass-dev[bot]: the GitHub App (docs/github-app/) reads artifacts whose name
      # starts with "genclass" and reviews the pull request from them. The buggy page of the e2e app is flagged on
      # purpose (it is what the check above requires), so a pull request that runs this job shows that finding once
      # for each suite that found it: the fixture's below, and the unmodified suite's in the artifact after it.
      - name: Upload the race files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: genclass-races
          path: packages/playwright/test/e2e/test-results/genclass
          retention-days: 7
          if-no-files-found: ignore

      # The race files genclass-playwright-run wrote for the unmodified suite on its defaults (two tests, two seeds):
      # the kind of files the workflow users copy (docs/github-app/workflows/genclass.yml) uploads, so the app reviews
      # this repository's pull requests from files written without the fixture too. The app puts every artifact's
      # files together and tells tests apart by name: these are "[chromium] search.spec.ts > ..." (the unmodified
      # suite's project has a name), the fixture's are "search.spec.ts > ...", so neither set is counted into the
      # other. The latency-only files of that suite carry the same test names under other chaos settings and are not
      # uploaded.
      - name: Upload the unmodified suite's race files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: genclass-races-unmodified
          path: packages/playwright/test/e2e-unmodified/test-results/genclass
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo '### GenClass fixture and unmodified suite, end to end'
            echo '```json'
            # the check's own summary: from its last line that is "{" alone to the end
            awk '/^\{$/ { n = NR } { line[NR] = $0 } END { if (n) for (i = n; i <= NR; i++) print line[i] }' "$RUNNER_TEMP/e2e.log" | tail -200
            echo '```'
            if [ -f packages/playwright/test/e2e/genclass-report.md ]; then
              echo
              echo '### The report the reporter wrote'
              cat packages/playwright/test/e2e/genclass-report.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
